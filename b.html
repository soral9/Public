<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css?v=6">
<script src="config.js?v=6"></script>
<script src="common.js?v=6"></script>
<title>Bさんの選択｜日程決め</title>
</head>
<body>
<main>
  <header>
    <h1><span id="who">Bさん</span>の選択</h1>
  </header>
  <section class="card">
    <span class="eyebrow">候補日</span>
    <div class="dates">
      <div><span class="tag d1">①</span> <span id="d1">…</span></div>
      <div><span class="tag d2">②</span> <span id="d2">…</span></div>
    </div>
    <p class="note err" id="noDates" hidden>候補日がまだ登録されていません。トップページで候補日（年間リスト）を保存してから、このページを開き直してください。</p>
  </section>
  <section class="card" id="secChoose">
    <span class="eyebrow">希望</span>
    <div class="choices" id="choices"></div>
    <p class="sub" id="state"></p>
    <div class="toast" id="toast" aria-live="polite"></div>
  </section>
  <section class="card" id="secR" hidden>
    <span class="eyebrow">結果</span>
    <div class="result" id="result"></div>
  </section>
  <section class="card" id="waiting" hidden>
    <span class="eyebrow">結果</span>
    <p class="sub" id="waitMsg"></p>
  </section>
  <section class="card">
    <div class="actions">
      <a class="btn secondary" id="indexLink" href="index.html">トップページへ</a>
    </div>
    <p class="note err" id="err" hidden></p>
  </section>
</main>
<script>window.APP_ROLE = 'b';</script>
<script src="choose.js?v=6"></script>
</body>
</html>
